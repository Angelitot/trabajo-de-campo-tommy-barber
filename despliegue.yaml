# Publicación de Tommy Barber (blueprint).
# - tommy-barber: cada cambio que se une a main arma la versión optimizada (npm run build)
#   y publica la carpeta publico/ como sitio estático.
# - tommy-barber-api: la API (servidor/) que guarda todo en la base de datos.
#   Las claves (DATABASE_URL, DUENO_USUARIO, DUENO_CLAVE y, si se quiere, DATABASE_CA) se cargan en el panel de Render:
#   no van en el repositorio.
services:
  - type: web
    runtime: static
    name: tommy-barber
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./publico
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - README.md
        - herramientas/empaquetar.py
        - herramientas/capturas.py
        - base-de-datos/**
        - servidor/**
        - docs/**
        - pruebas/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      # El panel se abre en /acceso-barberos (es la misma página)
      - type: rewrite
        source: /acceso-barberos
        destination: /index.html
    headers:
      - path: /acceso-barberos
        name: X-Robots-Tag
        value: noindex
      # Los archivos de assets/ llevan un hash en el nombre: el navegador puede guardarlos un año.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

  - type: web
    runtime: node
    name: tommy-barber-api
    region: oregon
    plan: free
    buildCommand: cd servidor && npm ci --omit=dev
    startCommand: node servidor/index.js
    healthCheckPath: /api/salud
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - servidor/**
        - base-de-datos/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITIO_URL
        value: https://tommy-barber.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DUENO_USUARIO
        sync: false
      - key: DUENO_CLAVE
        sync: false
      - key: DATABASE_CA
        sync: false
